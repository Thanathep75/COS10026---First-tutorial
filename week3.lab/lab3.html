<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <img src="logo.png" width="200" alt="Swinburne University Logo">

    <h1>CWA Help Desk Appointment</h1>

    <p>
        The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.
    </p>

    <p>
        Check Blackboard for when CWA tutors will be there.
    </p>

    <form>


        <fieldset>
            <legend>Student details</legend>

            <p>
                <label for="studentid">Student ID</label>
                <input type="text" id="studentid" name="studentid" required pattern="[0-9]{7,10}">
            </p>

            <p>
                <label for="givenname">Given Name</label>
                <input type="text" id="givenname" name="givenname" maxlength="15" pattern="[A-Za-z]+" required>

                <label for="familyname">Family Name</label>
                <input type="text" id="familyname" name="familyname" maxlength="15" pattern="[A-Za-z]+" required>
            </p>
        </fieldset>



        <fieldset>
            <legend>Your unit</legend>

            <p>
                <input type="radio" id="cos10011" name="unit" value="COS10011" required>
                <label for="cos10011">COS10011</label>

                <input type="radio" id="cos60004" name="unit" value="COS60004">
                <label for="cos60004">COS60004</label>

                <input type="radio" id="cos60007" name="unit" value="COS60007">
                <label for="cos60007">COS60007</label>
            </p>

            <p>
                <label for="tutor">Your Tutor</label>

                <select id="tutor" name="tutor" required>
                    <option value="">Please Select</option>
                    <option value="John">John</option>
                    <option value="Sarah">Sarah</option>
                    <option value="Michael">Michael</option>
                </select>
            </p>
        </fieldset>


        <!-- Issue -->
        <fieldset>
            <legend>Issue</legend>

            <p>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="issue" value="HTML" checked>

                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="issue" value="CSS">

                <label for="javascript">JavaScript</label>
                <input type="checkbox" id="javascript" name="issue" value="JavaScript">

                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="issue" value="PHP">

                <label for="mysql">MySQL</label>
                <input type="checkbox" id="mysql" name="issue" value="MySQL">
            </p>

            <p>
                <label for="description">Description of Issue</label>
                <br>

                <textarea id="description" name="description" rows="5" cols="30"
                    placeholder="Write description of your problem here..."></textarea>
            </p>

        </fieldset>


        <!-- Date / Time -->
        <fieldset>
            <legend>Preferred Date / Time</legend>

            <p>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
            </p>

            <p>
                <label for="time">Time</label>
                <input type="text" id="time" name="time" placeholder="00:00" pattern="[0-9]{2}:[0-9]{2}">
            </p>
        </fieldset>


        <p>
            <input type="submit" value="Book">
            <input type="reset" value="Reset form">
        </p>

    </form>

</body>

</html>
